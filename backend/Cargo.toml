[package]
name = "reauth-manager"
version = "0.1.10"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "ae5eaa46b447548571e6c46d69bd27d454adb785", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }
uuid = { version = "1.23.4", features = ["v4"] }
url = "2.5.8"
base64 = "0.22.1"
tempfile = "3.27.0"
flate2 = "1.1.9"
tar = "0.4.46"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
